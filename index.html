<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zupazupazuu — Crystal Jewelry</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Jost:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --pearl: #f6f1ec;
    --pearl-2: #efe6dd;
    --ink: #111111;
    --ink-soft: #4a4a4a;
    --rose: #1a1a1a;
    --rose-deep: #000000;
    --amethyst: #1a1a1a;
    --amethyst-deep: #000000;
    --gold: #000000;
    --white: #fffdfb;
    --line: rgba(0,0,0,0.14);
    --shadow: 0 20px 60px -20px rgba(0,0,0,0.3);
  }

  *{ box-sizing:border-box; margin:0; padding:0; }

  html{ scroll-behavior:smooth; }

  body{
    font-family:'Jost', sans-serif;
    background:
      radial-gradient(120% 80% at 15% -10%, rgba(226,206,190,0.4), transparent 60%),
      radial-gradient(120% 80% at 90% 0%, rgba(214,190,170,0.3), transparent 55%),
      linear-gradient(180deg, var(--pearl), var(--white));
    color:var(--ink);
    min-height:100vh;
    overflow-x:hidden;
    position:relative;
  }

  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:0.01ms !important; animation-iteration-count:1 !important; transition-duration:0.01ms !important; scroll-behavior:auto !important; }
  }

  .facet-bg{ position:fixed; inset:0; z-index:0; pointer-events:none; overflow:hidden; }
  .facet-bg span{
    position:absolute;
    background:linear-gradient(135deg, rgba(255,255,255,0.6), rgba(214,190,170,0.18));
    clip-path:polygon(50% 0%, 100% 38%, 82% 100%, 18% 100%, 0% 38%);
    opacity:0.5;
    filter:blur(0.2px);
  }
  .facet-bg span:nth-child(1){ width:120px; height:140px; top:8%; left:6%; transform:rotate(-12deg); opacity:0.35; }
  .facet-bg span:nth-child(2){ width:70px; height:82px; top:20%; right:10%; transform:rotate(20deg); opacity:0.3; }
  .facet-bg span:nth-child(3){ width:50px; height:58px; bottom:14%; left:12%; transform:rotate(8deg); opacity:0.25; }
  .facet-bg span:nth-child(4){ width:90px; height:104px; bottom:6%; right:8%; transform:rotate(-18deg); opacity:0.3; }

  .wrap{
    position:relative; z-index:1;
    max-width:560px;
    margin:0 auto;
    padding:64px 24px 48px;
  }

  .hero{
    text-align:center;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding-bottom:40px;
  }

  .gem{ width:96px; height:110px; margin-bottom:22px; animation: float 5s ease-in-out infinite; }
  @keyframes float{ 0%,100%{ transform:translateY(0px); } 50%{ transform:translateY(-8px); } }

  .logo{
    display:block;
    width:auto;
    max-width:300px;
    height:auto;
    margin:0 auto 6px;
  }

  .eyebrow{
    font-size:11px;
    letter-spacing:0.22em;
    text-transform:uppercase;
    color:var(--amethyst-deep);
    font-weight:700;
    margin-bottom:18px;
  }
  .eyebrow::before,.eyebrow::after{ content:''; }

  h1{
    font-family:'Playfair Display', serif;
    font-weight:600;
    font-size:clamp(44px, 11vw, 64px);
    letter-spacing:0.01em;
    line-height:1;
    color:var(--ink);
  }

  .subtitle{
    font-family:'Cormorant Garamond', serif;
    font-style:italic;
    font-weight:400;
    font-size:20px;
    color:var(--ink-soft);
    margin-top:8px;
    letter-spacing:0.04em;
  }

  .tagline{
    margin-top:20px;
    font-size:14.5px;
    line-height:1.6;
    color:var(--ink-soft);
    max-width:340px;
  }

  .shop-head{ display:flex; align-items:center; gap:14px; margin:44px 0 22px; }
  .shop-head::before, .shop-head::after{
    content:'';
    flex:1;
    height:1px;
    background:linear-gradient(90deg, transparent, var(--line), transparent);
  }
  .shop-head h2{
    font-family:'Playfair Display', serif;
    font-weight:500;
    font-style:italic;
    font-size:24px;
    color:var(--amethyst-deep);
    white-space:nowrap;
  }

  .links{
    margin-top:44px;
    display:grid;
    grid-template-columns:repeat(1, 1fr);
    gap:clamp(10px, 4vw, 20px);
    justify-items:center;
  }

  .card{
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    width:100%;
    max-width:260px;
    padding:16px 20px;
    background:var(--white);
    border:1px solid var(--line);
    border-radius:999px;
    text-decoration:none;
    color:var(--amethyst-deep);
    font-size:14px;
    letter-spacing:0.03em;
    box-shadow:0 1px 0 rgba(255,255,255,0.6) inset;
    transition:transform 0.35s cubic-bezier(.2,.8,.2,1), box-shadow 0.35s ease, border-color 0.35s ease;
    overflow:hidden;
  }

  .card::before{
    content:'';
    position:absolute;
    top:0; left:-140%;
    width:60%; height:100%;
    background:linear-gradient(115deg, transparent, rgba(255,255,255,0.85), transparent);
    transform:skewX(-18deg);
    transition:left 0.7s ease;
  }
  .card:hover::before{ left:140%; }

  .card:hover{
    transform:translateY(-4px);
    box-shadow:var(--shadow);
    border-color:rgba(155,127,166,0.4);
  }

  .card:focus-visible{ outline:2px solid var(--amethyst-deep); outline-offset:3px; }

  .card svg{ width:20px; height:20px; flex-shrink:0; }

  .card.cs{ color:var(--ink); }

  .flag{
    font-size:15px;
    line-height:1;
  }

  footer{ margin-top:56px; text-align:center; }

  .copyright{ margin-top:18px; font-size:11px; letter-spacing:0.06em; color:rgba(42,33,48,0.4); }

  @media (max-width:380px){
    .wrap{ padding:48px 16px 36px; }
  }
</style>
</head>
